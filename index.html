<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>经济学院 2026届毕业纪念</title>
<style>
/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:    #C8151B;
  --red-dk: #A01115;
  --white:  #FFFFFF;
  --bg:     #F7F7F7;
  --text:   #333333;
  --muted:  #888888;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --shadow-hover: 0 8px 24px rgba(0,0,0,.15);
  --radius: 12px;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
               Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  overflow-x: hidden;
}

/* ============================================================
   COVER PAGE
   ============================================================ */
.cover-page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--white);
  position: relative;
  overflow: hidden;
}

/* --- cover header bar --- */
.cover-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--white);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #f0f0f0;
}

.cover-logo {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: contain;
  background: rgba(200,21,27,.06);
  padding: 4px;
  flex-shrink: 0;
}

.cover-header-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.cover-header-title {
  font-size: .95rem;
  font-weight: 700;
  color: var(--red);
  letter-spacing: .3px;
}

.cover-header-sub {
  font-size: .68rem;
  color: var(--muted);
}

/* --- cover photo wall: two rows, opposite scroll, drag-to-swipe --- */
.cover-photos {
  width: 100%;
  height: 42vh;
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: #eaeaea;
  overflow: hidden;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
}

.cover-photos.dragging {
  cursor: grabbing;
}

.photo-strip {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.photo-strip-track {
  display: flex;
  gap: 3px;
  height: 100%;
  will-change: transform;
}

.photo-item {
  flex-shrink: 0;
  height: 100%;
  overflow: hidden;
  background: #ddd;
}

.photo-item img {
  height: 100%;
  width: auto;
  display: block;
  pointer-events: none;
}

/* --- cover info section --- */
.cover-info {
  text-align: center;
  padding: 28px 20px 12px;
  background: var(--white);
}

.cover-dept {
  font-size: .85rem;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.cover-title {
  font-size: 1.7rem;
  font-weight: 800;
  color: var(--red);
  letter-spacing: 2px;
  line-height: 1.3;
}

.cover-desc {
  font-size: .82rem;
  color: #999;
  margin-top: 8px;
  line-height: 1.6;
}

/* --- enter button --- */
.cover-action {
  text-align: center;
  padding: 10px 20px 32px;
  background: var(--white);
}

.btn-timeline {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 48px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--red);
  background: var(--white);
  border: 2px solid var(--red);
  border-radius: 50px;
  cursor: pointer;
  letter-spacing: 1px;
  margin-bottom: 12px;
  transition: background .2s, color .2s;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn-timeline:hover {
  background: rgba(200,21,27,.06);
}

.btn-timeline:active {
  transform: scale(.96);
}

.btn-enter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 15px 48px;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--white);
  background: var(--red);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 4px 16px rgba(200,21,27,.35);
  transition: transform .2s, box-shadow .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}

.btn-enter:active {
  transform: scale(.96);
}

.btn-enter:hover {
  background: var(--red-dk);
  box-shadow: 0 6px 24px rgba(200,21,27,.45);
}

.btn-enter-arrow {
  font-size: 1.2rem;
  transition: transform .2s;
}

.btn-enter:hover .btn-enter-arrow {
  transform: translateX(4px);
}

/* --- cover wave/decoration --- */
.cover-ribbon {
  height: 4px;
  background: var(--red);
  opacity: .15;
}

/* ============================================================
   PAGE VISIBILITY
   ============================================================ */
.book-page    { display: none; }
.timeline-page { display: none; }

body.in-book     .cover-page  { display: none; }
body.in-book     .book-page   { display: block; }
body.in-book     .timeline-page { display: none; }

body.in-timeline .cover-page  { display: none; }
body.in-timeline .book-page   { display: none; }
body.in-timeline .timeline-page { display: block; }

/* ============================================================
   TIMELINE PAGE
   ============================================================ */
.timeline-page {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
}

.timeline-container {
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 24px 20px;
  position: relative;
}

/* Center vertical line — real element, animated by JS */
.timeline-line {
  position: absolute;
  left: 50%;
  top: 24px;
  width: 2px;
  height: 0;
  background: var(--red);
  border-radius: 1px;
  opacity: 0;
  transform: translateX(-50%);
  transition: height 1.2s cubic-bezier(.22,.61,.36,1), opacity .3s ease;
  z-index: 0;
}

.timeline-line::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--red);
  opacity: 0.7;
}

@media (max-width: 480px) {
  .timeline-line {
    left: 28px;
    transform: none;
  }
}

/* --- timeline node --- */
.timeline-item {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity .5s ease, transform .5s ease;
  margin-bottom: 48px;
  position: relative;
}

.timeline-item.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Dot on the line */
.timeline-dot {
  position: absolute;
  top: 4px;
  left: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--red);
  border: 3px solid var(--white);
  box-shadow: 0 0 0 2px var(--red);
  transform: translateX(-50%);
  z-index: 2;
}

.timeline-item.golden .timeline-dot {
  width: 20px;
  height: 20px;
  background: #B8860B;
  box-shadow: 0 0 0 3px #B8860B44, 0 0 12px #B8860B55;
  border: 4px solid var(--white);
}

/* --- node content card --- */
.timeline-card {
  background: var(--white);
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: var(--shadow);
  width: 42%;
  position: relative;
}

/* Desktop: alternate left/right */
@media (min-width: 481px) {
  .timeline-item:nth-child(odd) .timeline-card {
    margin-left: 52%;
  }

  .timeline-item:nth-child(even) .timeline-card {
    margin-right: 52%;
    text-align: right;
  }
}

/* Mobile: all cards right */
@media (max-width: 480px) {
  .timeline-dot {
    left: 28px;
  }

  .timeline-card {
    width: calc(100% - 56px);
    margin-left: 56px !important;
  }
}

.timeline-item.golden .timeline-card {
  border: 1px solid #B8860B44;
  background: linear-gradient(135deg, #FFFDF7, #FFF8E7);
  box-shadow: 0 4px 20px rgba(184,134,11,.12);
}

.timeline-date {
  font-size: .85rem;
  font-weight: 700;
  color: var(--red);
  margin-bottom: 6px;
  letter-spacing: .3px;
}

.timeline-item.golden .timeline-date {
  font-size: .92rem;
  color: #B8860B;
}

.timeline-event {
  font-size: .88rem;
  line-height: 1.7;
  color: #555;
}

.timeline-item.golden .timeline-event {
  font-weight: 600;
  color: #5a4a1a;
}

/* --- timeline photos strip --- */
.timeline-photos {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-top: 10px;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

.timeline-photo {
  flex-shrink: 0;
  width: 110px;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: transform .2s;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

.timeline-photo:active {
  transform: scale(.95);
}

/* Photo zoom modal */
.photo-zoom-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 300;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.photo-zoom-overlay.active {
  display: flex;
}

.photo-zoom-overlay img {
  max-width: 95vw;
  max-height: 90vh;
  border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,.5);
}

.photo-zoom-close {
  position: absolute;
  top: 16px;
  right: 20px;
  color: #fff;
  font-size: 2rem;
  cursor: pointer;
  z-index: 301;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
}

/* ============================================================
   BOOK PAGE (hidden initially)
   ============================================================ */
  display: block;
}

/* ---- back-to-cover button ---- */
.book-top-bar {
  background: var(--red);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(200,21,27,.3);
}

.btn-back {
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.3);
  color: var(--white);
  font-size: .82rem;
  padding: 7px 16px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .2s;
  font-family: inherit;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
  text-shadow: 0 1px 2px rgba(0,0,0,.15);
}

.btn-back:hover {
  background: rgba(255,255,255,.3);
}

.book-top-logo {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: contain;
  background: rgba(255,255,255,.12);
  padding: 3px;
}

.book-top-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0,0,0,.18);
  letter-spacing: 0.5px;
}

/* ============================================================
   BOOK: Hero
   ============================================================ */
.hero {
  background: var(--red);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  box-shadow: 0 2px 8px rgba(200,21,27,.3);
}

.hero-logo {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: contain;
  background: rgba(255,255,255,.15);
  padding: 4px;
}

.hero-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.hero-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--white);
  letter-spacing: .5px;
  white-space: nowrap;
}

.hero-subtitle {
  font-size: .75rem;
  color: rgba(255,255,255,.85);
  font-weight: 400;
  white-space: nowrap;
}

/* ============================================================
   BOOK: Search
   ============================================================ */
.search-container {
  padding: 12px 16px;
  position: sticky;
  top: 48px;
  z-index: 99;
  background: var(--bg);
}

.search-wrapper {
  position: relative;
  max-width: 500px;
  margin: 0 auto;
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  pointer-events: none;
  color: #aaa;
}

.search-icon svg {
  display: block;
  width: 100%;
  height: 100%;
}

.search-input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  border: 2px solid transparent;
  border-radius: 24px;
  font-size: .95rem;
  background: var(--white);
  color: var(--text);
  outline: none;
  box-shadow: var(--shadow);
  transition: border-color .2s, box-shadow .2s;
  font-family: inherit;
}

.search-input::placeholder { color: #bbb; }

.search-input:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(200,21,27,.12), var(--shadow);
}

.search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #bbb;
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  display: none;
  border-radius: 50%;
  transition: color .2s, background .2s;
}

.search-clear.visible { display: block; }
.search-clear:hover { color: #666; background: #eee; }

.stats-bar {
  text-align: center;
  padding: 0 16px 8px;
  font-size: .82rem;
  color: var(--muted);
}

.no-results {
  display: none;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.no-results.visible { display: block; }

.no-results-icon {
  margin-bottom: 12px;
  opacity: .4;
}

.no-results-text {
  font-size: 1rem;
  color: #999;
}

/* ============================================================
   BOOK: Card Grid
   ============================================================ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 12px 24px;
}

@media (max-width: 400px) {
  .card-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 8px 20px; }
}

@media (min-width: 640px) {
  .card-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 0 20px 32px; max-width: 800px; margin: 0 auto; }
}

@media (min-width: 900px) {
  .card-grid { grid-template-columns: repeat(5, 1fr); gap: 16px; max-width: 1000px; }
}

.card {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .25s ease, box-shadow .25s ease;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  animation: cardFadeIn .4s ease both;
}

.card:active { transform: scale(.97); }

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}

.card-photo {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  display: block;
  background: #e8e8e8;
}

.card-placeholder {
  width: 100%;
  aspect-ratio: 1/1;
  background: linear-gradient(135deg, #e0e0e0, #d0d0d0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: #bbb;
  font-weight: 700;
}

.card-name {
  text-align: center;
  padding: 8px 4px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--red);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   BOOK: Modal
   ============================================================ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 200;
  justify-content: center;
  align-items: center;
  animation: fadeIn .25s ease;
}

.modal-overlay.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.modal-card {
  background: var(--white);
  border-radius: 16px;
  width: 90%;
  max-width: 400px;
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
  padding: 28px 24px 24px;
  box-shadow: 0 16px 48px rgba(0,0,0,.25);
  animation: modalSlideUp .3s ease;
}

@keyframes modalSlideUp {
  from { opacity: 0; transform: translateY(30px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-close {
  position: absolute;
  top: 10px; right: 14px;
  background: none;
  border: none;
  font-size: 1.5rem;
  color: var(--red);
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  border-radius: 50%;
  transition: background .2s;
  -webkit-tap-highlight-color: transparent;
}

.modal-close:hover { background: rgba(200,21,27,.08); }

.modal-photo-wrapper { text-align: center; margin-bottom: 16px; }

.modal-photo {
  width: 120px; height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--red);
  box-shadow: 0 4px 16px rgba(200,21,27,.2);
}

.modal-placeholder {
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 3px solid #ddd;
  background: linear-gradient(135deg, #e8e8e8, #d8d8d8);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
  color: #bbb;
  font-weight: 700;
}

.modal-name {
  text-align: center;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--red);
  margin-bottom: 4px;
}

.modal-id {
  text-align: center;
  font-size: .78rem;
  color: #aaa;
  margin-bottom: 4px;
}

.modal-major {
  text-align: center;
  font-size: .8rem;
  color: #C8151B;
  font-weight: 600;
  letter-spacing: .5px;
  margin-top: 2px;
  margin-bottom: 12px;
}

.modal-divider {
  border: none;
  border-top: 1px solid #eee;
  margin: 14px 0;
}

.modal-message {
  font-size: .95rem;
  line-height: 1.8;
  color: #444;
  white-space: pre-wrap;
  word-break: break-word;
  text-align: justify;
}

.modal-message-empty {
  text-align: center;
  color: #bbb;
  font-style: italic;
  padding: 20px 0;
}

/* ============================================================
   Mobile: Bottom Sheet Modal
   ============================================================ */
@media (max-width: 500px) {
  .modal-overlay { align-items: flex-end; }

  .modal-card {
    width: 100%; max-width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    max-height: 80vh;
    animation: bottomSheetUp .35s cubic-bezier(.16,1,.3,1);
  }

  @keyframes bottomSheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-close { top: 12px; right: 16px; font-size: 1.3rem; }
  .modal-photo, .modal-placeholder { width: 96px; height: 96px; }
  .modal-name { font-size: 1.15rem; }
}

/* ============================================================
   Footer
   ============================================================ */
.footer {
  text-align: center;
  padding: 16px 16px 32px;
  font-size: .75rem;
  color: #ccc;
}

.footer-heart { color: var(--red); }

/* ============================================================
   Cover page transition
   ============================================================ */
@keyframes coverOut {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-20px); }
}

@keyframes bookIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
</style>
</head>
<body>

<!-- ============================================================
     COVER PAGE
     ============================================================ -->
<div class="cover-page" id="coverPage">

  <!-- header bar -->
  <div class="cover-header">
    <img class="cover-logo" src="logo.jpg" alt="院徽" onerror="this.style.display='none'">
    <div class="cover-header-text">
      <div class="cover-header-title">复旦大学经济学院</div>
      <div class="cover-header-sub">School of Economics · Fudan University</div>
    </div>
  </div>

  <!-- group photo collage: 2x2 grid -->
  <div class="cover-photos" id="coverPhotos">
    <div class="photo-strip top" id="stripTop">
      <div class="photo-strip-track" id="trackTop"></div>
    </div>
    <div class="photo-strip bottom" id="stripBottom">
      <div class="photo-strip-track" id="trackBottom"></div>
    </div>
  </div>

  <!-- info section -->
  <div class="cover-ribbon"></div>
  <div class="cover-info">
    <div class="cover-dept">国际经济与贸易 · 财政学 双学位本科生班</div>
    <div class="cover-title">2026届 毕业纪念册</div>
    <div class="cover-desc">博学而笃志 · 切问而近思</div>
  </div>

<!-- ============================================================

     ============================================================ -->
<script>
(function() {
  'use strict';

  // ---- Data ----
  var allStudents = (typeof STUDENTS !== 'undefined') ? STUDENTS : [];
  var filteredStudents = allStudents.slice();
  var groupPhotos = (typeof GROUP_PHOTOS !== 'undefined') ? GROUP_PHOTOS : [];

  // ---- DOM: Cover ----
  var coverPage    = document.getElementById('coverPage');
  var coverPhotos  = document.getElementById('coverPhotos');
  var trackTop     = document.getElementById('trackTop');
  var trackBottom  = document.getElementById('trackBottom');
  var stripTop     = document.getElementById('stripTop');
  var stripBottom  = document.getElementById('stripBottom');
  var btnEnter     = document.getElementById('btnEnter');

  // ---- DOM: Book ----
  var bookPage    = document.getElementById('bookPage');
  var btnBack     = document.getElementById('btnBack');
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var cardGrid    = document.getElementById('cardGrid');
  var noResults   = document.getElementById('noResults');
  var statsBar    = document.getElementById('statsBar');

  // ---- DOM: Modal ----
  var modalOverlay = document.getElementById('modalOverlay');
  var modalCard    = document.getElementById('modalCard');
  var modalClose   = document.getElementById('modalClose');
  var modalPhoto   = document.getElementById('modalPhotoWrapper');
  var modalName    = document.getElementById('modalName');
  var modalId      = document.getElementById('modalId');
  var modalMessage = document.getElementById('modalMessage');

  // ---- DOM: Timeline ----
  var btnTimeline     = document.getElementById('btnTimeline');
  var btnTimelineBack = document.getElementById('btnTimelineBack');
  var btnTimelineEnter = document.getElementById('btnTimelineEnter');
  var timelineList    = document.getElementById('timelineList');
  var timelineLine    = document.getElementById('timelineLine');

  // ---- DOM: Photo zoom ----
  var photoZoomOverlay  = document.getElementById('photoZoomOverlay');
  var photoZoomImg      = document.getElementById('photoZoomImg');
  var photoZoomClose    = document.getElementById('photoZoomClose');

  // ============================================================
  //  Cover: Two-row photo wall — independent RAF per row + per-row drag
  // ============================================================
  function renderCoverPhotos() {
    if (groupPhotos.length === 0) return;

    // Split: even indices → top row, odd → bottom
    var photosTop = [], photosBottom = [];
    groupPhotos.forEach(function(src, i) {
      (i % 2 === 0 ? photosTop : photosBottom).push(src);
    });

    // Build track: append two full sets for seamless wrap
    function buildTrack(trackEl, photos) {
      trackEl.innerHTML = '';
      var frag = document.createDocumentFragment();
      function addSet() {
        photos.forEach(function(src) {
          var div = document.createElement('div');
          div.className = 'photo-item';
          var img = document.createElement('img');
          img.src = src; img.alt = ''; img.loading = 'lazy'; img.draggable = false;
          img.onerror = function() { div.style.display = 'none'; };
          div.appendChild(img);
          frag.appendChild(div);
        });
      }
      addSet();
      addSet();
      trackEl.appendChild(frag);
      return trackEl.getBoundingClientRect().width / 2;
    }

    var wrapTop = buildTrack(trackTop, photosTop);
    var wrapBot = buildTrack(trackBottom, photosBottom);

    // -------- Per-strip state --------
    // Each row: { pos, base (px/ms), inertia (px/ms), dragging, drag:{...} }
    function makeStrip(trackEl, wrapW, baseSpeed, container) {
      return {
        track: trackEl,
        wrap: wrapW,
        base: baseSpeed,
        pos: 0,
        inertia: 0,
        dragging: false,
        container: container,
        drag: { startX: 0, startPos: 0, lastX: 0, lastT: 0, vels: [] }
      };
    }

    var durTop = Math.max(20, photosTop.length * 3.5) * 1000;
    var durBot = Math.max(20, photosBottom.length * 3.5) * 1000;

    var strips = [
      makeStrip(trackTop,    wrapTop, -wrapTop / durTop,  stripTop),
      makeStrip(trackBottom, wrapBot,  wrapBot / durBot,  stripBottom)
    ];

    function wrapVal(p, w) {
      if (p <= -w) return p + w;
      if (p > 0)   return p - w;
      return p;
    }

    // -------- Shared RAF loop --------
    var lastTS = 0;
    function raf(ts) {
      if (!lastTS) lastTS = ts;
      var dt = ts - lastTS;
      lastTS = ts;

      if (dt > 0 && dt < 200) {
        strips.forEach(function(s) {
          if (s.dragging) return; // skip this strip while dragging

          // Decay inertia
          var decay = Math.pow(0.95, dt / 16);
          s.inertia *= decay;

          s.pos += (s.base + s.inertia) * dt;
          s.pos = wrapVal(s.pos, s.wrap);
          s.track.style.transform = 'translateX(' + s.pos + 'px)';
        });
      }
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // -------- Per-row drag --------
    function bindDrag(stripEl, s) {
      function getPx(e) { return e.touches ? e.touches[0].clientX : e.clientX; }

      function onStart(e) {
        s.dragging = true;
        s.inertia = 0;
        var px = getPx(e);
        s.drag.startX = px;
        s.drag.startPos = s.pos;
        s.drag.lastX = px;
        s.drag.lastT = performance.now();
        s.drag.vels = [];
        s.container.classList.add('dragging');
        if (e.cancelable) e.preventDefault();
      }

      function onMove(e) {
        if (!s.dragging) return;
        var px = getPx(e);
        var dx = px - s.drag.startX;
        s.pos = wrapVal(s.drag.startPos + dx, s.wrap);
        s.track.style.transform = 'translateX(' + s.pos + 'px)';

        var now = performance.now();
        var dt = now - s.drag.lastT;
        if (dt > 0) {
          s.drag.vels.push((px - s.drag.lastX) / dt);
          if (s.drag.vels.length > 8) s.drag.vels.shift();
        }
        s.drag.lastX = px;
        s.drag.lastT = now;
        if (e.cancelable) e.preventDefault();
      }

      function onEnd() {
        if (!s.dragging) return;
        s.dragging = false;
        s.container.classList.remove('dragging');

        var avgV = 0;
        if (s.drag.vels.length) {
          s.drag.vels.forEach(function(v) { avgV += v; });
          avgV /= s.drag.vels.length;
        }
        s.inertia = avgV - s.base;
      }

      stripEl.addEventListener('mousedown', onStart);
      stripEl.addEventListener('touchstart', onStart, { passive: false });
    }

    bindDrag(stripTop, strips[0]);
    bindDrag(stripBottom, strips[1]);

    // Global move/up — dispatch to correct strip
    window.addEventListener('mousemove', function(e) {
      strips.forEach(function(s) { onMoveFor(s, e.clientX); });
    });
    window.addEventListener('touchmove', function(e) {
      strips.forEach(function(s) { onMoveFor(s, e.touches[0].clientX); });
    }, { passive: false });
    window.addEventListener('mouseup', function() {
      strips.forEach(function(s) { onEndFor(s); });
    });
    window.addEventListener('touchend', function() {
      strips.forEach(function(s) { onEndFor(s); });
    });

    function onMoveFor(s, px) {
      if (!s.dragging) return;
      var dx = px - s.drag.startX;
      s.pos = wrapVal(s.drag.startPos + dx, s.wrap);
      s.track.style.transform = 'translateX(' + s.pos + 'px)';
      var now = performance.now();
      var dt = now - s.drag.lastT;
      if (dt > 0) {
        s.drag.vels.push((px - s.drag.lastX) / dt);
        if (s.drag.vels.length > 8) s.drag.vels.shift();
      }
      s.drag.lastX = px;
      s.drag.lastT = now;
    }

    function onEndFor(s) {
      if (!s.dragging) return;
      s.dragging = false;
      s.container.classList.remove('dragging');
      var avgV = 0;
      if (s.drag.vels.length) {
        s.drag.vels.forEach(function(v) { avgV += v; });
        avgV /= s.drag.vels.length;
      }
      s.inertia = avgV - s.base;
    }
  }

  // ============================================================
  //  Book: Render cards
  // ============================================================
  function renderCards(students) {
    cardGrid.innerHTML = '';

    if (students.length === 0) {
      noResults.classList.add('visible');
      cardGrid.style.display = 'none';
      updateStats(0);
      return;
    }

    noResults.classList.remove('visible');
    cardGrid.style.display = '';

    students.forEach(function(student, index) {
      var card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (index * .03) + 's';
      card.setAttribute('data-id', student.id);

      if (student.photo) {
        var img = document.createElement('img');
        img.className = 'card-photo';
        img.src = student.photo;
        img.alt = student.name;
        img.loading = 'lazy';
        img.onerror = function() {
          img.replaceWith(createPlaceholder(student.name));
        };
        card.appendChild(img);
      } else {
        card.appendChild(createPlaceholder(student.name));
      }

      var nameEl = document.createElement('div');
      nameEl.className = 'card-name';
      nameEl.textContent = student.name;
      card.appendChild(nameEl);

      card.addEventListener('click', function() { openModal(student); });
      cardGrid.appendChild(card);
    });

    updateStats(students.length);
  }

  function createPlaceholder(name) {
    var div = document.createElement('div');
    div.className = 'card-placeholder';
    div.textContent = name.charAt(0);
    return div;
  }

  function updateStats(count) {
    if (count === allStudents.length) {
      statsBar.textContent = '共 ' + allStudents.length + ' 位同学';
    } else {
      statsBar.textContent = '找到 ' + count + ' 位同学（共 ' + allStudents.length + ' 人）';
    }
  }

  // ============================================================
  //  Book: Search
  // ============================================================
  function doSearch(query) {
    var q = query.trim().toLowerCase();
    filteredStudents = q === '' ? allStudents.slice() : allStudents.filter(function(s) {
      return s.name.toLowerCase().indexOf(q) !== -1 || s.id.indexOf(q) !== -1;
    });
    renderCards(filteredStudents);
    if (q.length > 0) { searchClear.classList.add('visible'); }
    else { searchClear.classList.remove('visible'); }
  }

  searchInput.addEventListener('input', function() { doSearch(this.value); });
  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    doSearch('');
    searchInput.focus();
  });

  // ============================================================
  //  Modal
  // ============================================================
  function openModal(student) {
    if (student.photo) {
      modalPhoto.innerHTML = '<img class="modal-photo" src="' + student.photo + '" alt="' + student.name + '" onerror="this.parentElement.innerHTML=\'<div class=modal-placeholder>' + student.name.charAt(0) + '</div>\'">';
    } else {
      modalPhoto.innerHTML = '<div class="modal-placeholder">' + student.name.charAt(0) + '</div>';
    }
    modalName.textContent = student.name;
    modalId.textContent = student.id;
    var majorEl = document.getElementById('modalMajor');
    if (majorEl) {
      majorEl.textContent = student.major || '';
    }
    if (student.message) {
      modalMessage.textContent = student.message;
      modalMessage.className = 'modal-message';
    } else {
      modalMessage.textContent = '寄语收集中…';
      modalMessage.className = 'modal-message modal-message-empty';
    }
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) closeModal();
  });
  modalCard.addEventListener('click', function(e) { e.stopPropagation(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
  });

  // ============================================================
  //  Timeline Data
  // ============================================================
  var TIMELINE_DATA = [
    { year: "2023", date: "2023年8月",  photos: ["timeline/202308_1.jpg"],
      event: "经济学院2022级国际经济与贸易、财政学双学位本科生班正式成立。" },
    { year: "2023", date: "2023年8-9月", photos: ["timeline/202309_1.jpg"],
      event: "加入六连，精彩的军训生活。" },
    { year: "2023", date: "2023年10月", photos: ["timeline/202310_1.jpg"],
      event: "金山区劳动实践，在吕巷镇和平村体会到了乡村振兴的深刻含义。" },
    { year: "2024", date: "2024年6月",  photos: ["timeline/202406_1.jpg"],
      event: "绩点改革班会，大家赶上了好时候，3.3不再是这里的关键词。" },
    { year: "2024", date: "2024年9月",  photos: ["timeline/202409_1.jpg"],
      event: "大三第一堂生涯班会，大家对泛金融行业有了更加全面的了解。" },
    { year: "2024", date: "2024年10月", photos: ["timeline/202410_1.jpg"],
      event: "获评2023-2024学年复旦大学优秀学生集体，我们是最棒的！" },
    { year: "2026", date: "2026年6月",  photos: ["timeline/202606_1.jpg"],
      event: "我们毕业了！一百多人的大家庭，记忆在一次次对话、一段段经历中变得清晰，每一件小事共同组成了本科生涯灿烂的四年。大家毕业快乐！" }
  ];

  // ============================================================
  //  Timeline: Render
  // ============================================================
  function renderTimeline() {
    timelineList.innerHTML = '';
    timelineLine.style.height = '0';  // reset line
    // Hide line initially, show after first node
    timelineLine.style.opacity = '0';

    // Node interval: ~1.2s per node, 7 nodes ≈ 8.4s total
    var nodeDelay = 1200;

    TIMELINE_DATA.forEach(function(item, i) {
      var isLast = (i === TIMELINE_DATA.length - 1);

      // Build node
      var node = document.createElement('div');
      node.className = 'timeline-item' + (isLast ? ' golden' : '');

      // Dot
      var dot = document.createElement('div');
      dot.className = 'timeline-dot';
      node.appendChild(dot);

      // Card
      var card = document.createElement('div');
      card.className = 'timeline-card';

      var dateEl = document.createElement('div');
      dateEl.className = 'timeline-date';
      dateEl.textContent = item.date;

      var eventEl = document.createElement('div');
      eventEl.className = 'timeline-event';
      eventEl.textContent = item.event;

      card.appendChild(dateEl);
      card.appendChild(eventEl);

      // Photos strip
      if (item.photos && item.photos.length > 0) {
        var photosRow = document.createElement('div');
        photosRow.className = 'timeline-photos';
        item.photos.forEach(function(src) {
          var img = document.createElement('img');
          img.className = 'timeline-photo';
          img.src = src;
          img.loading = 'lazy';
          img.alt = item.date;
          img.addEventListener('click', function(e) {
            e.stopPropagation();
            photoZoomImg.src = src;
            photoZoomOverlay.classList.add('active');
          });
          photosRow.appendChild(img);
        });
        card.appendChild(photosRow);
      }

      node.appendChild(card);
      timelineList.appendChild(node);

      // Staggered reveal: node fades in, then line grows to it
      (function(n, idx) {
        var lineGrowDelay = 250; // ms after node appears before line grows

        setTimeout(function() {
          n.classList.add('visible');

          // Grow line after a short pause (line trails behind node)
          setTimeout(function() {
            if (timelineLine && n.querySelector('.timeline-dot')) {
              timelineLine.style.opacity = '1';
              var container = timelineLine.parentElement;
              var lineTop = timelineLine.getBoundingClientRect().top;
              var dotEl = n.querySelector('.timeline-dot');
              var dotRect = dotEl.getBoundingClientRect();
              // Stop line at dot's top edge (dot sits on top of the line)
              var targetH = dotRect.top - lineTop + container.scrollTop;
              timelineLine.style.height = targetH + 'px';
            }
          }, lineGrowDelay);
        }, idx * nodeDelay + 150);
      })(node, i);
    });
  }

  // ---- Photo zoom ----
  photoZoomClose.addEventListener('click', function() {
    photoZoomOverlay.classList.remove('active');
  });
  photoZoomOverlay.addEventListener('click', function(e) {
    if (e.target === photoZoomOverlay || e.target === photoZoomClose) {
      photoZoomOverlay.classList.remove('active');
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && photoZoomOverlay.classList.contains('active')) {
      photoZoomOverlay.classList.remove('active');
    }
  });

  // ============================================================
  //  Page Navigation
  // ============================================================
  function clearClasses() {
    document.body.classList.remove('in-book', 'in-timeline');
  }

  function goToBook() {
    clearClasses();
    document.body.classList.add('in-book');
    document.body.style.overflow = '';
    window.scrollTo(0, 0);
    window.location.hash = '#book';
  }

  function goToCover() {
    clearClasses();
    document.body.style.overflow = '';
    window.scrollTo(0, 0);
    window.location.hash = '#cover';
  }

  function goToTimeline() {
    clearClasses();
    document.body.classList.add('in-timeline');
    document.body.style.overflow = '';
    renderTimeline();
    window.scrollTo(0, 0);
    window.location.hash = '#timeline';
  }

  btnEnter.addEventListener('click', goToBook);
  btnBack.addEventListener('click', goToCover);
  btnTimeline.addEventListener('click', goToTimeline);
  btnTimelineBack.addEventListener('click', goToCover);
  btnTimelineEnter.addEventListener('click', goToBook);

  window.addEventListener('hashchange', function() {
    clearClasses();
    switch (window.location.hash) {
      case '#book':     document.body.classList.add('in-book'); break;
      case '#timeline': document.body.classList.add('in-timeline'); break;
    }
  });

  // ============================================================
  //  Init
  // ============================================================
  function init() {
    renderCoverPhotos();

    if (allStudents.length === 0) {
      cardGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#bbb;">暂无数据，请先运行 extract_data.py 生成 data.js</div>';
    } else {
      renderCards(allStudents);
    }

    // Check initial hash
    if (window.location.hash === '#book') {
      goToBook();
    } else if (window.location.hash === '#timeline') {
      goToTimeline();
    }
  }

  init();

})();
</script>
